services:
  - type: web
    name: spendward
    runtime: node
    plan: starter          # always on; the free plan sleeps and a judge would meet a cold start
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    # State (audit log, mandates, wallet, approvals) lives on a persistent
    # disk. Without one, every deploy or restart would wipe it.
    disk:
      name: spendward-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SPENDWARD_DATA_DIR
        value: /var/data
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      # Secrets: paste these from `npm run render:env` in the Render dashboard.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: MANDATE_PRIVATE_KEY
        sync: false
      - key: MANDATE_PUBLIC_KEY
        sync: false
      - key: AUDIT_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: MERCHANTS_JSON
        sync: false
