<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d">
  <title id="t">How Spendward works</title>
  <desc id="d">An AI agent finds products through Channel3 and calls PayPal tools through Spendward. Spendward verifies the signed mandate, runs fourteen deterministic rules, binds the payee from the mandate and records the decision. Allowed orders go to PayPal and are paid from the saved wallet, orders that need approval wait for the principal, and blocked orders never reach PayPal. PayPal's verified webhooks come back into the record.</desc>
  <defs>
    <style>
      .bg { fill: #0a0f1c; }
      .card { fill: #121a2b; stroke: #26314a; stroke-width: 1.2; }
      .core { fill: #0f1730; stroke: #4a6bff; stroke-width: 1.6; }
      .step { fill: #16203a; stroke: #2a3758; stroke-width: 1; }
      .h { font: 600 17px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e9edf5; }
      .hc { font: 700 20px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .s { font: 400 13px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #95a0b5; }
      .k { font: 600 11px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6d8bff; letter-spacing: .08em; }
      .num { font: 700 12px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0a0f1c; }
      .lbl { font: 500 12px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a95ab; }
      .line { stroke: #4b5a7a; stroke-width: 1.6; fill: none; }
      .allow { fill: #0e2a20; stroke: #34d399; stroke-width: 1.4; }
      .hold { fill: #2c230e; stroke: #fbbf24; stroke-width: 1.4; }
      .block { fill: #2e1218; stroke: #fb7185; stroke-width: 1.4; }
      .ta { font: 700 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #34d399; }
      .th { font: 700 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fbbf24; }
      .tb { font: 700 15px Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fb7185; }
      .pp { fill: #121a2b; stroke: #4a6bff; stroke-width: 1.4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5a7a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="690" rx="18"/>

  <!-- The principal signs a mandate -->
  <rect class="card" x="350" y="32" width="380" height="84" rx="12"/>
  <text class="k" x="372" y="58">THE PRINCIPAL</text>
  <text class="h" x="372" y="82">You describe limits, AI drafts, you sign</text>
  <text class="s" x="372" y="102">Ed25519 key. Nothing is in force until you sign.</text>
  <path class="line" d="M540 116 V164" marker-end="url(#a)"/>
  <text class="lbl" x="552" y="146">signed mandate (public key only)</text>

  <!-- Channel3 -->
  <rect class="card" x="40" y="168" width="230" height="104" rx="12"/>
  <text class="k" x="62" y="194">CHANNEL3</text>
  <text class="h" x="62" y="218">Live product listings</text>
  <text class="s" x="62" y="240">Best Buy, Macy's and 25,000+</text>
  <text class="s" x="62" y="256">retailers. Untrusted input.</text>
  <path class="line" d="M155 272 V330" marker-end="url(#a)"/>
  <text class="lbl" x="167" y="306">listings</text>

  <!-- The agent -->
  <rect class="card" x="40" y="334" width="230" height="118" rx="12"/>
  <text class="k" x="62" y="360">AI AGENT</text>
  <text class="h" x="62" y="384">Shops for you</text>
  <text class="s" x="62" y="406">LLM with tool calling.</text>
  <text class="s" x="62" y="422">Untrusted: it can be fooled</text>
  <text class="s" x="62" y="438">by what it reads.</text>

  <path class="line" d="M270 389 H344" marker-end="url(#a)"/>
  <text class="lbl" x="276" y="374">MCP call</text>
  <text class="lbl" x="276" y="410">PayPal's</text>
  <text class="lbl" x="276" y="425">tool names</text>

  <!-- Spendward -->
  <rect class="core" x="350" y="168" width="380" height="450" rx="14"/>
  <text class="k" x="374" y="196">ENFORCEMENT POINT</text>
  <text class="hc" x="374" y="224">Spendward</text>

  <rect class="step" x="374" y="246" width="332" height="78" rx="10"/>
  <circle cx="400" cy="272" r="11" fill="#6d8bff"/><text class="num" x="396" y="276">1</text>
  <text class="h" x="422" y="277">Verify the mandate</text>
  <text class="s" x="422" y="300">Signature checked with your public key.</text>

  <rect class="step" x="374" y="336" width="332" height="78" rx="10"/>
  <circle cx="400" cy="362" r="11" fill="#6d8bff"/><text class="num" x="396" y="366">2</text>
  <text class="h" x="422" y="367">14 deterministic rules</text>
  <text class="s" x="422" y="390">Amount, budget, shop, listing. No model.</text>

  <rect class="step" x="374" y="426" width="332" height="78" rx="10"/>
  <circle cx="400" cy="452" r="11" fill="#6d8bff"/><text class="num" x="396" y="456">3</text>
  <text class="h" x="422" y="457">Bind the payee</text>
  <text class="s" x="422" y="480">From the mandate, never the agent.</text>

  <rect class="step" x="374" y="516" width="332" height="78" rx="10"/>
  <circle cx="400" cy="542" r="11" fill="#6d8bff"/><text class="num" x="396" y="546">4</text>
  <text class="h" x="422" y="547">Record the decision</text>
  <text class="s" x="422" y="570">HMAC-chained, tamper-evident log.</text>

  <!-- Outcomes -->
  <path class="line" d="M730 270 H786" marker-end="url(#a)"/>
  <path class="line" d="M730 400 H786" marker-end="url(#a)"/>
  <path class="line" d="M730 530 H786" marker-end="url(#a)"/>

  <rect class="allow" x="790" y="226" width="226" height="88" rx="12"/>
  <text class="ta" x="810" y="256">ALLOW</text>
  <text class="s" x="810" y="280">Within the mandate.</text>
  <text class="s" x="810" y="298">Paid at once, no checkout.</text>

  <rect class="hold" x="790" y="356" width="226" height="88" rx="12"/>
  <text class="th" x="810" y="386">REQUIRE APPROVAL</text>
  <text class="s" x="810" y="410">You approve once, seeing</text>
  <text class="s" x="810" y="428">the exact PayPal account.</text>

  <rect class="block" x="790" y="486" width="226" height="88" rx="12"/>
  <text class="tb" x="810" y="516">BLOCK</text>
  <text class="s" x="810" y="540">Outside the grant.</text>
  <text class="s" x="810" y="558">PayPal is never called.</text>

  <!-- PayPal -->
  <path d="M1016 270 H1076" stroke="#34d399" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <path d="M1016 400 H1046 V318 H1076" stroke="#fbbf24" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text class="lbl" x="1052" y="372">after</text>
  <text class="lbl" x="1052" y="387">approval</text>

  <rect class="pp" x="1080" y="226" width="160" height="134" rx="12"/>
  <text class="k" x="1100" y="252">PAYPAL</text>
  <text class="h" x="1100" y="276">Orders v2</text>
  <text class="s" x="1100" y="298">Payee set by</text>
  <text class="s" x="1100" y="314">Spendward.</text>
  <text class="s" x="1100" y="330">Paid from the</text>
  <text class="s" x="1100" y="346">Vault wallet.</text>

  <path class="line" d="M1160 360 V476" marker-end="url(#a)"/>
  <text class="lbl" x="1170" y="422">webhooks</text>

  <rect class="card" x="1080" y="480" width="160" height="102" rx="12"/>
  <text class="k" x="1100" y="506">CONFIRMED</text>
  <text class="h" x="1100" y="530">Verified</text>
  <text class="s" x="1100" y="552">Signature checked,</text>
  <text class="s" x="1100" y="568">shown in Activity.</text>

  <!-- Footnote -->
  <text class="s" x="40" y="660">Spendward speaks PayPal's tool names, so the agent needs no changes. A refused request leaves no trace at PayPal.</text>
</svg>
