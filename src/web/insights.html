<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spendward Insights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #studio { height: 100%; }
</style>
<!--
  The Insights report, framed by the dashboard. AG Studio carries its own copy
  of AG Grid and its CSS; inside this frame that CSS cannot restyle the
  dashboard's own tables.
-->
<script src="https://cdn.jsdelivr.net/npm/ag-studio@3.0.0/dist/umd/ag-studio.min.js"></script>
</head>
<body>
<div id="studio" aria-label="Spendward report"></div>
<script type="module">
// Only meaningful inside the dashboard, which supplies the data and the theme.
if (window.parent === window) location.replace("/#insights");
const host = window.parent;
const hostRoot = host.document.documentElement;
const css = name => host.getComputedStyle(hostRoot).getPropertyValue(name).trim();
const isDark = () => hostRoot.dataset.theme ? hostRoot.dataset.theme === "dark" : host.matchMedia("(prefers-color-scheme: dark)").matches;

const stamp = t => { const d = new Date(t), z = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const ACTION = { create_order: "Create order", pay_order: "Pay order", get_order: "Get order", search_products: "Search",
                 create_refund: "Refund", cancel_subscription: "Cancel subscription" };
let state = { audit: [], events: [], merchants: {} };

const OUTCOME = { ALLOW: "Allowed", REQUIRE_APPROVAL: "Held for you", BLOCK: "Blocked" };

/** Four tables, built from the same state every other page reads. */
function insightsData() {
  const a = state.audit ?? [];
  const shop = m => m ? (state.merchants ?? {})[m] ?? m : "—";
  const day = t => stamp(t).slice(0, 10);
  // The same definition of "a request" as Overview: a payment Spendward
  // collected, or the record of you approving an order, is not a new request.
  const requests = a.filter(e => e.tool !== "pay_order" && !(e.outcome === "ALLOW" && e.violations.length));
  const approved = new Set(a.filter(e => e.outcome === "ALLOW" && e.violations.length && e.paypalOrderId).map(e => e.paypalOrderId));
  // The rules a prompt injection trips: money redirected to another account, an
  // order that does not match the listing, or a subscription slipped in.
  const ATTACK = new Set(["UNAUTHORIZED_RECIPIENT", "LISTING_MISMATCH", "SUBSCRIPTION_NOT_ALLOWED"]);
  const rank = { ALLOW: 0, REQUIRE_APPROVAL: 1, BLOCK: 2 };
  // Sorted by outcome so the donut always lists Allowed, Held, Blocked in that
  // order, matching the series order of the per-day chart.
  const decisions = [...requests].sort((x, y) => (rank[x.outcome] ?? 3) - (rank[y.outcome] ?? 3) || x.seq - y.seq).map(e => ({
    id: e.seq, time: e.at, day: day(e.at), action: ACTION[e.tool] ?? e.tool, shop: shop(e.merchant),
    amount: e.amount, outcome: OUTCOME[e.outcome] ?? e.outcome,
    allowed: e.outcome === "ALLOW" ? 1 : 0, held: e.outcome === "REQUIRE_APPROVAL" ? 1 : 0, blocked: e.outcome === "BLOCK" ? 1 : 0,
    reached: e.tool === "create_order" && e.paypalOrderId && !e.error ? 1 : 0,
    attack: e.outcome === "BLOCK" && e.violations.some(v => ATTACK.has(v.rule)) ? 1 : 0,
    blockedAmount: e.outcome === "BLOCK" ? e.amount ?? 0 : 0,
    task: e.sourceContext ?? "",
  }));
  const rules = requests.flatMap(e => e.violations.map((v, i) => ({
    id: `${e.seq}.${i}`, decision: e.seq, rule: v.rule, severity: v.severity,
    outcome: OUTCOME[e.outcome] ?? e.outcome, policy: v.policy ?? "", requested: v.requested ?? "", evidence: v.evidence ?? "",
  })));
  const payments = a.filter(e => e.tool === "pay_order" && e.outcome === "ALLOW" && !e.error).map(e => ({
    id: e.seq, time: e.at, day: day(e.at), shop: shop(e.merchant), payee: e.payeeAccount ?? "—",
    amount: e.amount ?? 0, order: e.paypalOrderId ?? "", approved: approved.has(e.paypalOrderId) ? "Approved by you" : "Within the mandate",
    byYou: approved.has(e.paypalOrderId) ? 1 : 0,
  }));
  const confirmations = (state.events ?? []).map((e, i) => ({
    id: i + 1, time: e.at, type: e.type, verified: e.verification, summary: e.summary ?? "",
  }));
  const f = (id, name, format, description) => ({ id, name, format, ...(description ? { description } : {}) });
  return {
    description: "Spendward sits between an AI shopping agent and PayPal. Every payment the agent attempts is checked against a mandate the user signed; the outcome is Allowed, Held for you (waits for the user's approval) or Blocked. Amounts are USD. When naming a rule such as MANDATE_MAX_AMOUNT, write it in backticks.",
    sources: [
      { id: "decisions", name: "Decisions", description: "One row per request the AI agent made to Spendward.", data: decisions, fields: [
        f("id", "Decision", "integerFormat"), f("time", "Time", "dateTimeFormat"), f("day", "Day", "textFormat"),
        f("action", "Action", "textFormat"), f("shop", "Shop", "textFormat"), f("amount", "Amount", "currencyFormat"),
        f("outcome", "Outcome", "textFormat", "Allowed, Held for you, or Blocked"),
        f("allowed", "Allowed", "integerFormat", "1 if allowed"), f("held", "Held", "integerFormat", "1 if held for the user's approval"),
        f("blocked", "Blocked", "integerFormat", "1 if blocked"), f("reached", "Reached PayPal", "integerFormat", "1 if an order was created at PayPal"),
        f("attack", "Attack stopped", "integerFormat", "1 if blocked by a rule a prompt injection trips: UNAUTHORIZED_RECIPIENT, LISTING_MISMATCH or SUBSCRIPTION_NOT_ALLOWED"),
        f("blockedAmount", "Amount blocked", "currencyFormat", "The amount asked for, if the request was blocked"),
        f("task", "Task", "textFormat", "What the agent said it was doing"),
      ] },
      { id: "rules", name: "Rules triggered", description: "One row per mandate rule a decision broke. Prompt-injection attacks show up as UNAUTHORIZED_RECIPIENT, LISTING_MISMATCH or SUBSCRIPTION_NOT_ALLOWED.", data: rules, fields: [
        f("id", "Violation", "textFormat"), f("decision", "Decision", "integerFormat"), f("rule", "Rule", "textFormat"),
        f("severity", "Severity", "textFormat"), f("outcome", "Outcome", "textFormat"), f("policy", "Policy", "textFormat"),
        f("requested", "Requested", "textFormat"), f("evidence", "Evidence", "textFormat"),
      ] },
      { id: "payments", name: "Payments", description: "Money that actually moved through PayPal, and the account Spendward paid.", data: payments, fields: [
        f("id", "Payment", "integerFormat"), f("time", "Time", "dateTimeFormat"), f("day", "Day", "textFormat"),
        f("shop", "Shop", "textFormat"), f("payee", "Paid to (PayPal account)", "textFormat"), f("amount", "Amount", "currencyFormat"),
        f("order", "PayPal order", "textFormat"), f("approved", "How", "textFormat"),
        f("byYou", "Approved by you", "integerFormat", "1 if you approved this payment after it was held"),
      ] },
      { id: "confirmations", name: "PayPal confirmations", description: "Webhooks PayPal sent, with their signature verification result.", data: confirmations, fields: [
        f("id", "Confirmation", "integerFormat"), f("time", "Time", "dateTimeFormat"), f("type", "Event", "textFormat"),
        f("verified", "Verification", "textFormat"), f("summary", "Summary", "textFormat"),
      ] },
    ],
    relationships: [
      { id: "rule-decision", type: "many-to-one", source: { tableId: "rules", fieldId: "decision" }, target: { tableId: "decisions", fieldId: "id" } },
    ],
  };
}

const kpi = (text, value) => ({ type: "value", format: { title: { enabled: true, text } }, dataMapping: { value: [value] } });
const INSIGHTS_REPORT = {
  selectedPageId: "overview",
  pages: [{
    id: "overview",
    widgets: {
      // Activity already counts requests by outcome; these are the figures it does not show.
      k1: kpi("Paid via PayPal", { id: "payments.amount", aggregation: "sum" }),
      k2: kpi("Money blocked", { id: "decisions.blockedAmount", aggregation: "sum" }),
      k3: kpi("Attacks stopped", { id: "decisions.attack", aggregation: "sum" }),
      k4: kpi("Approved by you", { id: "payments.byYou", aggregation: "sum" }),
      k5: kpi("Shops paid", { id: "payments.shop", aggregation: "countd" }),
      k6: kpi("Rules triggered", { id: "rules.id", aggregation: "countd" }),
      // Dollars, not counts: Overview already counts requests by outcome.
      outcomes: { type: "donut-chart", format: { title: { enabled: true, text: "Amount asked, by outcome" } },
        dataMapping: { categoryKey: [{ id: "decisions.outcome" }], valueKey: [{ id: "decisions.amount", aggregation: "sum" }] } },
      perDay: { type: "column-chart-stacked", format: { title: { enabled: true, text: "Requests per day" },
        style: { theme: { common: { legend: { enabled: true, position: "bottom" } } } } },
        // One series per outcome, in a fixed order, so each keeps the colour it has in the donut.
        dataMapping: { categoryKey: [{ id: "decisions.day" }], valueKey: [
          { id: "decisions.allowed", aggregation: "sum" }, { id: "decisions.held", aggregation: "sum" }, { id: "decisions.blocked", aggregation: "sum" }] } },
      rules: { type: "bar-chart-grouped", format: { title: { enabled: true, text: "Rules that stopped a payment" } },
        dataMapping: { categoryKey: [{ id: "rules.rule" }], valueKey: [{ id: "rules.id", aggregation: "countd" }] } },
      money: { type: "grid", format: { title: { enabled: true, text: "Where the money went" } },
        dataMapping: { cols: [{ id: "payments.shop" }, { id: "payments.payee" }, { id: "payments.amount", aggregation: "sum" }] } },
    },
    widgetLayout: {
      k1: { xTrack: 0, yTrack: 0, xSpan: 4, ySpan: 3 }, k2: { xTrack: 4, yTrack: 0, xSpan: 4, ySpan: 3 },
      k3: { xTrack: 8, yTrack: 0, xSpan: 4, ySpan: 3 }, k4: { xTrack: 12, yTrack: 0, xSpan: 4, ySpan: 3 },
      k5: { xTrack: 16, yTrack: 0, xSpan: 4, ySpan: 3 }, k6: { xTrack: 20, yTrack: 0, xSpan: 4, ySpan: 3 },
      outcomes: { xTrack: 0, yTrack: 3, xSpan: 8, ySpan: 7 }, perDay: { xTrack: 8, yTrack: 3, xSpan: 16, ySpan: 7 },
      rules: { xTrack: 0, yTrack: 10, xSpan: 12, ySpan: 7 }, money: { xTrack: 12, yTrack: 10, xSpan: 12, ySpan: 7 },
    },
  }],
};

function studioTheme() {
  return agStudio.studioTheme.withParams({
    browserColorScheme: isDark() ? "dark" : "light",
    backgroundColor: css("--panel-solid"),
    foregroundColor: css("--ink"),
    textColor: css("--ink"),
    subtleTextColor: css("--muted"),
    borderColor: css("--line-strong"),
    accentColor: css("--accent"),
    fontFamily: "Inter, ui-sans-serif, system-ui, sans-serif",
    studioWrapperBackgroundColor: css("--panel-solid"),
    studioWrapperBorder: false,
    studioCanvasBackgroundColor: css("--panel-solid"),
    studioCanvasBorder: false,
    studioCanvasShadow: "none",
    studioWidgetBackgroundColor: css("--bg"),
    studioWidgetBorder: { color: css("--line") },
    studioWidgetBorderRadius: 12,
    studioWidgetTitleFontFamily: "Inter, ui-sans-serif, system-ui, sans-serif",
    studioWidgetTitleFontSize: 14,
    studioWidgetTitleFontWeight: 600,
    studioWidgetTitleTextColor: css("--muted"),
    studioValueWidgetFontSize: 30,
    // The dashboard's own accents, so the report reads as part of the product.
    chartFontFamily: "Inter, ui-sans-serif, system-ui, sans-serif",
    chartTextColor: css("--muted"),
    chartGridLineColor: css("--line"),
    chartAxisLineColor: css("--line-strong"),
    chartPaletteFills1Color: css("--accent"),
    chartPaletteFills2Color: css("--accent-2"),
    chartPaletteFills3Color: css("--accent-3"),
    chartPaletteStrokes1Color: css("--accent"),
    chartPaletteStrokes2Color: css("--accent-2"),
    chartPaletteStrokes3Color: css("--accent-3"),
  });
}

let studio = null, key = null, asking = false;

window.insights = {
  /** Called by the dashboard with each fresh /api/state. */
  async update(next) {
    // A copy made here, so every array the report holds belongs to this frame.
    state = JSON.parse(JSON.stringify(next));
    const k = (state.audit ?? []).length + ":" + (state.events ?? []).length;
    if (studio) {
      if (k !== key) { key = k; studio.updateProperties({ data: insightsData() }); }
      return;
    }
    key = k;
    const { openaiAdapter } = await import("/insights/ai-adapter.js");
    studio = agStudio.createStudio(document.getElementById("studio"), {
      theme: studioTheme(),
      loadThemeGoogleFonts: false,
      layout: { rowHeight: 40, widgetPadding: 16 },
      mode: "view",
      // Asking shows the report and the assistant side by side; the assistant
      // builds or changes widgets itself when asked.
      panels: { edit: { right: ["ai"] }, view: {} },
      data: insightsData(),
      initialState: INSIGHTS_REPORT,
      // The model and its key live on the server; the page only names the route.
      ai: ({ api }) => agStudio.createAiHarness(api, {
        adapter: openaiAdapter({ endpoint: "/api/ai", model: "spendward" }),
        promptStarters: [
          { label: "Attacks caught", prompt: "Which prompt-injection attacks did Spendward stop, and what rule caught each one?" },
          { label: "Where money went", prompt: "Which PayPal accounts received money, and how much each?" },
          { label: "Why held", prompt: "Why were payments held for my approval?" },
          { label: "Spend by shop", prompt: "Add a chart of the amount the agent asked to spend at each shop, split by outcome." },
        ],
      }),
    }, { modules: [agStudio.AgStudioAiModule] });
  },
  setTheme() { studio?.updateProperties({ theme: studioTheme() }); },
  /** The report opens read-only; asking switches to edit mode with the assistant. */
  toggleAsk() {
    if (!studio) return false;
    asking = !asking;
    studio.updateProperties({ mode: asking ? "edit" : "view" });
    return asking;
  },
};
host.dispatchEvent(new host.Event("insights-ready"));
</script>
</body>
</html>
