<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spendward</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%234d8bff' stroke-width='2.6'%3E%3Cpath d='M1.5 16h29' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='12.8'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@34/dist/ag-grid-community.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;         --panel: #ffffff;      --ink: #11161d;
    --muted: #5b6673;      --line: #e3e7ec;       --accent: #0b5cff;
    --allow: #0a7d44;      --allow-bg: #e7f6ee;
    --block: #c42b2b;      --block-bg: #fdeaea;
    --approve: #9a6400;    --approve-bg: #fdf2dd;
    --radius: 10px;
  }
  :root { --allow: #0a7d44; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117;       --panel: #151b23;      --ink: #e7edf3;
      --muted: #9aa7b4;    --line: #262f3a;       --accent: #4d8bff;
      --allow: #3fb97a;    --allow-bg: #13301f;
      --block: #ff6b6b;    --block-bg: #331616;
      --approve: #e2a93a;  --approve-bg: #332814;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117;         --panel: #151b23;      --ink: #e7edf3;
    --muted: #9aa7b4;      --line: #262f3a;       --accent: #4d8bff;
    --allow: #3fb97a;      --allow-bg: #13301f;
    --block: #ff6b6b;      --block-bg: #331616;
    --approve: #e2a93a;    --approve-bg: #332814;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 28px 16px 72px; }
  /* Money must align column to column, or scanning a ledger is guesswork. */
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  header { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; padding-bottom: 18px;
           border-bottom: 1px solid var(--line); }
  .mark { width: 30px; height: 30px; color: var(--accent); flex: none; }
  .wordmark { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.025em; font-weight: 680; }
  .tagline { color: var(--muted); font-size: 14px; }

  /* The pipeline. A judge who has never seen this product should understand it
     from this strip alone: what the agent asked, what was let through, and what
     actually reached PayPal. */
  .flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 10px; align-items: stretch;
          margin: 22px 0; }
  .node { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .node.gate { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .nlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
            font-weight: 600; }
  .nbig { font-size: 25px; font-weight: 660; letter-spacing: -0.035em; line-height: 1.2;
          font-variant-numeric: tabular-nums; }
  .nbig .ok { color: var(--allow); } .nbig .no { color: var(--block); }
  .nbig .sep { color: var(--muted); font-weight: 400; margin: 0 2px; }
  .nsub { font-size: 13px; color: var(--muted); }
  .arrow { align-self: center; color: var(--muted); font-size: 18px; line-height: 1; }
  @media (max-width: 760px) {
    .flow { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
  }

  /* An unanswered decision should look unanswered. */
  section.urgent { border-color: var(--approve); }
  section.urgent > h2 { color: var(--approve); }
  .count { background: var(--approve); color: #000; border-radius: 999px; padding: 1px 8px;
           font-size: 11.5px; margin-left: 7px; font-variant-numeric: tabular-nums; }
  .empty { margin: 0; color: var(--muted); display: flex; align-items: center; gap: 9px; }
  .empty svg { width: 16px; height: 16px; flex: none; color: var(--allow); }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 22px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .card .big { font-size: 25px; font-weight: 660; letter-spacing: -0.035em; line-height: 1.15; }
  .card .sub { margin-top: 3px; }
  /* The budget bar is the mark made functional: a fixed line, a rising fill. */
  .meter { height: 5px; border-radius: 3px; background: var(--line); margin-top: 11px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--accent); border-radius: 3px;
               transition: width .45s ease; }
  .meter.over > i { background: var(--block); }
  .card .sub { color: var(--muted); font-size: 13px; }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
  section > h2 { font-size: 12.5px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line);
                 font-weight: 660; letter-spacing: -0.005em; }

  .pending { padding: 16px; display: grid; gap: 12px; }
  .approval { border: 1px solid var(--approve); background: var(--approve-bg); border-radius: var(--radius); padding: 14px 16px; }
  .approval .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .approval .amount { font-size: 19px; font-weight: 650; }
  .approval ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  button {
    font: inherit; font-weight: 550; padding: 8px 15px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.07); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .badge { display: inline-block; padding: 1px 9px; line-height: 20px; white-space: nowrap; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .badge.allow { color: var(--allow); background: var(--allow-bg); }
  .badge.block { color: var(--block); background: var(--block-bg); }
  .badge.approval { color: var(--approve); background: var(--approve-bg); }

  .toolbar label { align-self: center; color: var(--muted); font-size: 14px; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  input[type=search] {
    font: inherit; padding: 7px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); flex: 1; min-width: 180px;
  }
  input[type=search]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #grid { height: 420px; }

  dialog {
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
    color: var(--ink); padding: 0; max-width: 620px; width: calc(100vw - 32px);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0; padding: 15px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .detail { padding: 18px; }
  .row { display: grid; grid-template-columns: 150px 1fr; gap: 8px; padding: 5px 0; font-size: 14px; }
  .row dt { color: var(--muted); }
  .row dd { margin: 0; word-break: break-word; }
  .violation { border-left: 3px solid var(--block); padding: 8px 12px; margin-top: 10px; background: var(--block-bg); border-radius: 0 6px 6px 0; }
  .violation b { display: block; font-size: 13px; }
  .violation span { color: var(--muted); font-size: 13px; }
  .close { padding: 0 18px 18px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .chain-ok { color: var(--allow); } .chain-bad { color: var(--block); }
  dialog { max-height: 85vh; overflow-y: auto; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 2px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 560px) { .card .big { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M1.5 16h29" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M3.2 16a12.8 12.8 0 0 0 25.6 0Z" fill="currentColor" opacity=".22"/>
      <circle cx="16" cy="16" r="12.8" stroke="currentColor" stroke-width="2.6"/>
    </svg>
    <div class="wordmark">
      <h1>Spendward</h1>
      <span class="tagline">authorization firewall between AI agents and PayPal</span>
    </div>
  </header>

  <div class="flow" id="flow" aria-live="polite"></div>

  <div class="cards" id="cards"></div>

  <section aria-labelledby="pending-h" id="pending-section">
    <h2 id="pending-h">Needs you</h2>
    <div class="pending" id="pending"></div>
  </section>

  <section aria-labelledby="events-h">
    <h2 id="events-h">What PayPal says happened</h2>
    <div class="pending" id="events"></div>
  </section>

  <section aria-labelledby="audit-h">
    <h2 id="audit-h">Audit trail</h2>
    <div class="toolbar">
      <label for="q">Filter decisions</label>
      <input type="search" id="q" placeholder="Filter by tool, merchant, outcome or rule…">
      <button id="refresh">Refresh</button>
    </div>
    <div id="grid" role="region" aria-label="Decision history. Select a row and press Enter to investigate it."></div>
  </section>
</div>

<dialog id="detail" aria-labelledby="detail-h">
  <h3 id="detail-h">Investigation</h3>
  <div class="detail" id="detail-body"></div>
  <div class="close"><button id="detail-close" class="primary">Close</button></div>
</dialog>

<script type="module">
const tick = () => `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const money = (a, c) => a == null ? "—" : `${c ?? "USD"} ${Number(a).toFixed(2)}`;
const when  = t => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const esc   = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));

const badge = o => o === "ALLOW" ? `<span class="badge allow">allowed</span>`
               : o === "BLOCK"   ? `<span class="badge block">blocked</span>`
               : `<span class="badge approval">approval</span>`;

let grid, state = { audit: [], approvals: [], mandate: null, chain: { valid: true } };

const columns = [
  { headerName: "Time", field: "at", width: 110, valueFormatter: p => when(p.value) },
  { headerName: "Agent", field: "agent", width: 125 },
  { headerName: "Tool", field: "tool", width: 150 },
  { headerName: "Amount", field: "amount", width: 118, type: "rightAligned",
    cellStyle: { fontVariantNumeric: "tabular-nums" },
    valueFormatter: p => p.value == null ? "—" : money(p.value, p.data.currency) },
  { headerName: "Merchant", field: "merchant", width: 135, valueFormatter: p => p.value ?? "—" },
  { headerName: "Decision", field: "outcome", width: 125,
    cellRenderer: p => badge(p.value), cellStyle: { display: "flex", alignItems: "center" } },
  { headerName: "Rules triggered", flex: 1, minWidth: 240,
    // An allowed row carrying violations is one the principal approved. Showing
    // the bare rule name there reads as a contradiction.
    valueGetter: p => {
      const rules = p.data.violations.map(v => v.rule).join(", ");
      if (p.data.error) return "allowed by Spendward, rejected by PayPal";
      if (!rules) return "—";
      return p.data.outcome === "ALLOW" ? `${rules} — approved by you` : rules;
    } },
];

function paint() {
  const a = state.audit;
  const blocked = a.filter(e => e.outcome === "BLOCK").length;
  const escalated = a.filter(e => e.outcome === "REQUIRE_APPROVAL").length;
  const spent = state.spent ?? 0;
  const m = state.mandate;

  document.getElementById("cards").innerHTML = `
    <div class="card"><h2>Mandate</h2>
      ${state.revokedAt
        ? `<div class="big" style="color:var(--block)">revoked</div>
           <div class="sub">${when(state.revokedAt)} · every request is now refused</div>`
        : `<div class="big num">${m ? money(m.maxTransactionAmount, m.currency) : "—"}</div>
           <div class="sub">per transaction · <span class="num">${m ? money(m.maxTotalAmount, m.currency) : "—"}</span> total</div>
           ${m ? `<button data-revoke="1" style="margin-top:10px;padding:5px 12px;font-size:13px;color:var(--block);border-color:var(--block)">Revoke mandate</button>` : ""}`}</div>
    <div class="card"><h2>Spent</h2>
      <div class="big num">${money(spent, m?.currency)}</div>
      <div class="sub">${m ? `<span class="num">${money(state.spend?.collected ?? 0, m.currency)}</span> paid · <span class="num">${money(state.spend?.held ?? 0, m.currency)}</span> awaiting payment` : ""}</div>
      ${m ? `<div class="meter${spent > m.maxTotalAmount ? " over" : ""}" role="img"
               aria-label="${Math.round((spent / m.maxTotalAmount) * 100)} percent of the mandate used">
               <i style="width:${Math.min(100, (spent / m.maxTotalAmount) * 100)}%"></i></div>` : ""}</div>
    <div class="card"><h2>Refused</h2>
      <div class="big">${blocked}</div>
      <div class="sub">${escalated} escalated to you</div></div>
    <div class="card"><h2>Audit chain</h2>
      <div class="big ${state.chain.valid ? "chain-ok" : "chain-bad"}">${state.chain.valid ? "intact" : "broken"}</div>
      <div class="sub">${state.chain.valid ? a.length + " entries verified" : "entry #" + state.chain.brokenAt + " — " + state.chain.reason}</div></div>`;

  // Only order attempts count as requests; probes for read-only tools are not
  // the agent asking to spend anything.
  const attempts = a.length;
  const allowed  = a.filter(e => e.outcome === "ALLOW").length;
  const held     = attempts - allowed;
  const reachedPaypal = a.filter(e => e.paypalOrderId).length;
  const captured = a.filter(e => e.tool === "pay_order" && e.outcome === "ALLOW").length;

  document.getElementById("flow").innerHTML = `
    <div class="node">
      <span class="nlabel">Agent</span>
      <span class="nbig">${attempts}</span>
      <span class="nsub">request${attempts === 1 ? "" : "s"} made</span>
    </div>
    <div class="arrow" aria-hidden="true">&rarr;</div>
    <div class="node gate">
      <span class="nlabel">Spendward</span>
      <span class="nbig"><span class="ok">${allowed}</span><span class="sep">/</span><span class="no">${held}</span></span>
      <span class="nsub">passed · stopped</span>
    </div>
    <div class="arrow" aria-hidden="true">&rarr;</div>
    <div class="node">
      <span class="nlabel">PayPal</span>
      <span class="nbig">${reachedPaypal}</span>
      <span class="nsub">order${reachedPaypal === 1 ? "" : "s"} reached it${captured ? ` · ${captured} captured` : ""}</span>
    </div>`;

  const pending  = state.approvals.filter(x => x.status === "PENDING");
  // Every order Spendward let through that nobody has paid for yet: allowed
  // outright or approved by you. Both wait on the same thing, a buyer.
  const toCapture = state.toCollect ?? [];
  const collected = state.collectedCount ?? 0;

  const section = document.getElementById("pending-section");
  section.classList.toggle("urgent", pending.length > 0);
  document.getElementById("pending-h").innerHTML =
    `Needs you${pending.length ? `<span class="count">${pending.length}</span>` : ""}`;

  document.getElementById("pending").innerHTML = (pending.length === 0 && toCapture.length === 0
    ? `<p class="empty">${tick()} Nothing needs you right now.${
        collected ? ` ${collected} payment${collected > 1 ? "s" : ""} captured.` : ""}</p>` : "") +
    toCapture.map(o => `
      <article class="approval" style="border-color:var(--accent);background:transparent">
        <div class="head">
          <div><strong>${esc(o.merchant)}</strong> · ${o.approved ? "approved by you" : "allowed"}, waiting for the buyer
            <div class="sub">order <code>${esc(o.orderId)}</code></div></div>
          <div class="amount num">${money(o.amount, o.currency)}</div>
        </div>
        <div class="actions">
          <a href="https://www.sandbox.paypal.com/checkoutnow?token=${encodeURIComponent(o.orderId)}" target="_blank" rel="noopener"><button>Open PayPal checkout</button></a>
          <button class="primary" data-capture="${esc(o.orderId)}">Capture payment</button>
          <span class="sub" data-result="${esc(o.orderId)}" role="status"></span>
        </div>
      </article>`).join("") +
    pending.map(p => `
      <article class="approval">
        <div class="head">
          <div><strong>${esc(p.request.merchant)}</strong> · ${esc(p.request.category)}
            <div class="sub">${esc(p.agent)} · quantity ${p.request.quantity}</div></div>
          <div class="amount num">${money(p.request.amount, p.request.currency)}</div>
        </div>
        <ul>${p.violations.map(v => `<li>${esc(v.evidence)}</li>`).join("")}</ul>
        <div class="actions">
          <button class="primary" data-approve="${p.id}">Approve once</button>
          <button data-reject="${p.id}">Reject</button>
        </div>
      </article>`).join("");

  const ev = state.events ?? [];
  document.getElementById("events").innerHTML = ev.length === 0
    ? `<p class="empty" style="color:var(--muted)">Nothing from PayPal yet. Confirmations appear here once a payment is approved or captured.</p>`
    : `<table style="width:100%;border-collapse:collapse;font-size:14px">
         ${ev.map(e => `
           <tr style="border-bottom:1px solid var(--line)">
             <td style="padding:7px 0;color:var(--muted);white-space:nowrap">${when(e.at)}</td>
             <td style="padding:7px 10px"><code>${esc(e.type)}</code></td>
             <td style="padding:7px 10px;color:var(--muted)">${esc(e.resourceId) || ""}</td>
             <td style="padding:7px 0;text-align:right">${
               e.verification === "SUCCESS"
                 ? `<span class="badge allow">verified</span>`
                 : `<span class="badge block">${esc(e.verification)}</span>`}</td>
           </tr>`).join("")}
       </table>`;

  grid?.setGridOption("rowData", a);
}

async function load() {
  const r = await fetch("/api/state");
  state = await r.json();
  paint();
}

function openDetail(e) {
  document.getElementById("detail-body").innerHTML = `
    <dl class="row"><dt>Decision</dt><dd>${badge(e.outcome)}</dd></dl>
    <dl class="row"><dt>Agent</dt><dd>${esc(e.agent)}</dd></dl>
    <dl class="row"><dt>Mandate</dt><dd><code>${esc(e.mandateId)}</code></dd></dl>
    <dl class="row"><dt>Tool</dt><dd><code>${esc(e.tool)}</code></dd></dl>
    <dl class="row"><dt>Requested</dt><dd>${money(e.amount, e.currency)} · quantity ${e.quantity ?? "—"}</dd></dl>
    <dl class="row"><dt>Merchant</dt><dd>${esc(e.merchant)}</dd></dl>
    <dl class="row"><dt>Payee</dt><dd>${esc(e.recipient)}</dd></dl>
    <dl class="row"><dt>Instruction source</dt><dd>${esc(e.sourceContext) || "—"}</dd></dl>
    <dl class="row"><dt>PayPal call</dt><dd>${
      e.error ? "<strong>attempted, rejected by PayPal</strong><br><code>" + esc(e.error) + "</code>"
      : e.paypalOrderId ? "<code>" + esc(e.paypalOrderId) + "</code>" : "<strong>not executed</strong>"}</dd></dl>
    <dl class="row"><dt>Entry hash</dt><dd><code>${esc(e.hash).slice(0,32)}…</code></dd></dl>
    ${e.violations.map(v => `
      <div class="violation">
        <b>${esc(v.rule)} · ${esc(v.severity)}</b>
        <span>policy: ${esc(v.policy)}<br>requested: ${esc(v.requested)}<br>${esc(v.evidence)}</span>
      </div>`).join("")}`;
  document.getElementById("detail").showModal();
}

grid = agGrid.createGrid(document.getElementById("grid"), {
  theme: matchMedia("(prefers-color-scheme: dark)").matches
    ? agGrid.themeQuartz.withPart(agGrid.colorSchemeDark) : agGrid.themeQuartz,
  columnDefs: columns,
  rowData: [],
  rowHeight: 42,
  // Every decision carries its colour, so the outcome is readable from the row
  // itself without reading the badge.
  getRowStyle: p => ({
    ALLOW: { background: "var(--allow-bg)" },
    BLOCK: { background: "var(--block-bg)" },
    REQUIRE_APPROVAL: { background: "var(--approve-bg)" },
  })[p.data.outcome],
  onRowClicked: e => openDetail(e.data),
  // Without this the investigation panel is mouse-only.
  onCellKeyDown: e => { if (e.event?.key === "Enter" || e.event?.key === " ") openDetail(e.data); },
  overlayNoRowsTemplate: "No decisions recorded yet. Run an agent to populate this.",
});

document.getElementById("q").addEventListener("input", e =>
  grid.setGridOption("quickFilterText", e.target.value));
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("detail-close").addEventListener("click", () =>
  document.getElementById("detail").close());

// Revoking is final, so it asks first. Spending again needs a new mandate.
document.getElementById("cards").addEventListener("click", async e => {
  if (!e.target.dataset?.revoke) return;
  if (!confirm("Revoke this mandate? Every later request will be refused, and pending approvals can no longer be granted. This cannot be undone.")) return;
  e.target.disabled = true;
  await fetch("/api/mandate/revoke", { method: "POST" });
  await load();
});

document.getElementById("pending").addEventListener("click", async e => {
  const d = e.target.dataset ?? {};
  const action = d.approve ? "approve" : d.reject ? "reject" : d.capture ? "capture" : null;
  if (!action) return;
  const id = d.approve ?? d.reject ?? d.capture;

  e.target.disabled = true;
  const res = await fetch(action === "capture" ? `/api/orders/${encodeURIComponent(id)}/capture` : `/api/approvals/${id}/${action}`, { method: "POST" });
  const body = await res.json().catch(() => ({}));

  if (action === "approve" && !res.ok) alert(body.error ?? "approval refused");
  if (action === "capture") {
    const slot = document.querySelector(`[data-result="${id}"]`);
    if (slot) slot.textContent = res.ok ? `captured: ${body.status}` : body.error;
    e.target.disabled = false;
    if (!res.ok) return;
  }
  await load();
});

load();
setInterval(load, 4000);
</script>
</body>
</html>
